  /v1/automations/{id}/versions/{versionId}/promote:
    post:
      operationId: automations.versions.promote
      summary: Promote a workflow version
      description: Make an existing tagged YAML workflow candidate current without creating another history row. Only tagged version rows can be promoted; untagged snapshots (including restore HEAD) and missing ids return 404. Agent automations return 400. Requires a Bearer API key or a dashboard session.
      tags:
      - Automations
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: Workflow id, agent id, or typed alias like workflows.slug / agents.slug
        required: true
        description: Workflow id, agent id, or typed alias like workflows.slug / agents.slug
      - in: path
        name: versionId
        schema:
          type: string
          description: Tagged version id from GET /automations/{id}/versions. Untagged snapshots (for example after restore) and unknown ids return 404.
        required: true
        description: Tagged version id from GET /automations/{id}/versions. Untagged snapshots (for example after restore) and unknown ids return 404.
      responses:
        '200':
          description: Existing tagged workflow version promoted.
          content:
            application/json:
