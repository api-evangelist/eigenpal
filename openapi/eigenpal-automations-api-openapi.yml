openapi: 3.2.0
info:
  title: Eigenpal Automations API
  version: 1.0.0
  description: Public REST API for inspecting automations, starting and monitoring runs, managing files, collecting human reviews, and running evaluations.
  contact:
    name: Eigenpal
    url: https://eigenpal.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://api.eigenpal.com
  description: Production (canonical API hostname)
security:
- bearerAuth: []
tags:
- name: Automations
  description: Inspect runnable workflow and agent automations, their versions, triggers, and source sync state. Move YAML workflows between folders and delete automations.
paths:
  /v1/automations:
    get:
      operationId: automations.list
      summary: List automations
      description: Returns workflows and agents through one runnable automation collection. Use `type` to narrow to workflows or agents, `search` to find automations by slug, name, or description, and `folderId` to list YAML workflows in a folder (`null` for root).
      tags:
      - Automations
      parameters:
      - in: query
        name: search
        schema:
          description: Substring match against slug, name, or description
          type: string
        description: Substring match against slug, name, or description
      - in: query
        name: type
        schema:
          description: Filter by implementation type
          type: string
          enum:
          - workflow
          - agent
        description: Filter by implementation type
      - in: query
        name: folderId
        schema:
          description: Filter YAML workflows by folder. A folder id matches that folder; `null` matches unfiled workflows at root. Agent automations have no folders, so this filter excludes them. Cannot be combined with `type=agent`.
          type: string
        description: Filter YAML workflows by folder. A folder id matches that folder; `null` matches unfiled workflows at root. Agent automations have no folders, so this filter excludes them. Cannot be combined with `type=agent`.
      - in: query
        name: limit
        schema:
          description: Maximum number of automations to return.
          type: integer
          minimum: 1
          maximum: 100
        description: Maximum number of automations to return.
      - in: query
        name: offset
        schema:
          description: Zero-based offset for paging through automations.
          type: integer
          minimum: 0
          maximum: 9007199254740991
        description: Zero-based offset for paging through automations.
      responses:
        '200':
          description: Page of runnable workflow and agent automations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAutomationsResponse'
        '400':
          description: Validation error. Request shape did not match the spec.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '403':
          description: API key lacks required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '413':
          description: Payload too large. Upload exceeded the per-request size cap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              description: Seconds until the next request may succeed
              schema:
                type: string
          content:
