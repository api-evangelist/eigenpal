  /v1/automations/{id}/dataset-review-requests/{reviewId}/items/{itemId}:
    patch:
      operationId: automations.datasetReviewRequests.updateItem
      summary: Update dataset review item
      description: 'Approve, edit, remove, reopen, comment, or record a field-decision or file-decision on one review item while the parent request is draft, open, or paused. Pass `expectedUpdatedAt` from the item the client last observed. Pass `fieldPath` with `action: comment` or `action: field-decision`, `filePath` with `action: file-decision`. `action: edit-file` is multipart-only: send `file` bytes with `filePath` (correct an existing expected file) or `newPath` (upload a brand-new expected file) plus `expectedUpdatedAt`.'
      tags:
      - Evaluation
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: Automation id or typed alias.
        required: true
        description: Automation id or typed alias.
      - in: path
        name: reviewId
        schema:
          type: string
          description: Dataset review request id.
        required: true
        description: Dataset review request id.
      - in: path
        name: itemId
        schema:
          type: string
          description: Dataset review item id.
        required: true
        description: Dataset review item id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatasetReviewItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EditDatasetReviewItemFile'
      responses:
