components:
  schemas:
    DatasetExampleExpectedFileRenameRequest:
      type: object
      properties:
        newFilename:
          type: string
          description: New basename for the file. The parent folder is preserved.
      required:
      - newFilename
    DatasetExampleUpdate:
      type: object
      properties:
        name:
          description: Example name. Required on create; omitted or null uses a generated name where supported.
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
        input:
          description: Input arguments for the example.
          anyOf:
          - type: object
            propertyNames:
              type: string
            additionalProperties: {}
          - type: 'null'
        expected:
          description: Expected JSON output. Null clears the expected output.
          anyOf:
          - {}
          - type: 'null'
        metadata:
          description: Caller-managed metadata.
          anyOf:
          - type: object
            propertyNames:
              type: string
            additionalProperties: {}
          - type: 'null'
        annotation:
          description: Human note about the example. Null clears the annotation.
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
        rowOrder:
          description: Optional display order. Null clears the order.
          anyOf:
          - type: integer
            minimum: 0
            maximum: 9007199254740991
          - type: 'null'
        overrides:
          description: Step output overrides used during example runs.
          anyOf:
          - type: object
            propertyNames:
              type: string
            additionalProperties: {}
          - type: 'null'
      additionalProperties: false
      description: Partial update for a dataset example. Omitted fields are preserved.
    Experiment:
      type: object
      properties:
        id:
          type: string
          description: Experiment batch id. Some CLI commands historically call this a batch id.
        automationId:
          type: string
          description: Automation this experiment belongs to.
        automationType:
          $ref: '#/components/schemas/AutomationType'
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          description: Experiment batch status.
        runCount:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Total runs in the experiment.
        completedCount:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Runs that have completed.
        passedCount:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Runs whose evaluator scores passed.
        failedCount:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Runs whose evaluator scores failed.
        avgScore:
          anyOf:
          - type: number
          - type: 'null'
          description: Average automated evaluator score.
        createdAt:
          anyOf:
          - type: string
          - type: string
        completedAt:
          anyOf:
          - anyOf:
            - type: string
            - type: string
          - type: 'null'
        version:
          anyOf:
          - type: string
          - type: 'null'
