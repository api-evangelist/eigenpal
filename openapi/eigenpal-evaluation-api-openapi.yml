      additionalProperties: false
    EditDatasetReviewItemFile:
      type: object
      properties:
        action:
          description: Must be edit-file for the multipart item PATCH form.
          type: string
          const: edit-file
        file:
          description: Corrected expected-file bytes (50MB cap).
          format: binary
          type: string
        filePath:
          type: string
          minLength: 1
        newPath:
          type: string
          minLength: 1
        comment:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        expectedUpdatedAt:
          type: string
          minLength: 1
      required:
      - expectedUpdatedAt
    DatasetReviewItemList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DatasetReviewItem'
      required:
      - items
      additionalProperties: false
    DatasetReviewFocusFieldOutput:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          description: Dotted expected-output path the reviewer should inspect, e.g. vendor.iban.
        reason:
          description: Optional reason this field needs attention.
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
      required:
      - path
      additionalProperties: false
    DatasetExampleInputFileUploadRequest:
      type: object
      properties:
        file:
          type: array
          items:
            type: string
            format: binary
          description: One or more input files to upload.
      required:
      - file
    DatasetExampleExpectedFileUploadResponse:
      type: object
      properties:
        uploaded:
          type: array
          items:
            type: string
          description: Stored expected file paths.
      required:
      - uploaded
      additionalProperties: false
    DatasetReviewDetail:
      type: object
      properties:
        id:
          type: string
        automationId:
          type: string
        title:
          type: string
        instructions:
          anyOf:
          - type: string
          - type: 'null'
        focusFields:
          type: array
          items:
            $ref: '#/components/schemas/DatasetReviewFocusFieldOutput'
        ignoredFields:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - draft
          - open
          - paused
          - closed
          - cancelled
        exampleNames:
          type: array
          items:
            type: string
        progress:
          $ref: '#/components/schemas/DatasetReviewProgress'
        createdBy:
          anyOf:
          - type: string
          - type: 'null'
        createdAt:
          type: string
        closedAt:
          anyOf:
          - type: string
          - type: 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DatasetReviewItem'
        events:
          type: array
          items:
            $ref: '#/components/schemas/DatasetReviewEvent'
      required:
      - id
      - automationId
      - title
      - instructions
      - focusFields
      - ignoredFields
      - status
      - exampleNames
      - progress
      - createdBy
      - createdAt
      - closedAt
      - items
      additionalProperties: false
    ExperimentCreateResponse:
      type: object
      properties:
        id:
          type: string
          description: Experiment batch id.
        runs:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Run id.
              exampleId:
                anyOf:
                - type: string
                - type: 'null'
                description: Dataset example id.
            required:
            - id
            - exampleId
            additionalProperties: false
          description: Runs enqueued for this experiment.
        total:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Number of runs enqueued.
      required:
      - id
      - runs
      - total
      additionalProperties: false
      description: Accepted experiment batch and the runs it enqueued.
    DatasetReviewExpectedFile:
      type: object
      properties:
        path:
          type: string
          description: Expected-file path relative to the example expected/ folder.
        fileId:
          type: string
          description: Version id for the current bytes. Empty for snapshot-origin files, which resolve by path.
        filename:
          type: string
        origin:
          type: string
          enum:
          - snapshot
          - corrected
          - uploaded
          description: Whether the current bytes are the snapshotted dataset file, a reviewer-corrected version, or a brand-new reviewer upload.
      required:
      - path
      - fileId
      - filename
      - origin
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API key issued from Settings → API Keys. Pass as `Authorization: Bearer <key>`.'
