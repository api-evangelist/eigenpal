    post:
      operationId: automations.datasetReviewRequests.create
      summary: Create dataset review request
      description: Snapshot selected dataset examples into a review request. Include instructions, focusFields to highlight, and ignoredFields for paths reviewers can skip. Optional itemNotes become commented events on those examples.
