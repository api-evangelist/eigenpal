                - type: string
                - type: string
              completedAt:
                anyOf:
                - anyOf:
                  - type: string
                  - type: string
                - type: 'null'
            required:
            - id
            - status
            - exampleId
            - exampleName
            - createdAt
            - completedAt
            additionalProperties: false
          description: Runs created for dataset examples in this experiment.
        resultsByRun:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/EvalResult'
          description: Evaluator results keyed by run id.
      required:
      - id
      - automationId
      - automationType
      - status
      - runCount
      - completedCount
      - passedCount
      - failedCount
      - avgScore
      - createdAt
      - completedAt
      - version
      - runs
      - resultsByRun
      additionalProperties: false
      description: Experiment batch detail.
    EvalResult:
      type: object
      properties:
        id:
          type: string
          description: Evaluator result id.
        runId:
          type: string
          description: Run this score belongs to.
        automationId:
          anyOf:
          - type: string
          - type: 'null'
          description: Automation this score belongs to.
        evaluatorName:
          type: string
          description: Evaluator name from configuration.
        evaluatorType:
          type: string
          description: Evaluator implementation type.
        score:
          anyOf:
          - type: number
          - type: 'null'
          description: Automated evaluator score. Do not confuse this with a human review verdict.
        passed:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Whether this evaluator passed.
        label:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional evaluator label.
        weight:
          anyOf:
          - type: number
          - type: 'null'
          description: Weight used in aggregate scoring.
        passThreshold:
          anyOf:
          - type: number
          - type: 'null'
          description: Score threshold required for this evaluator to pass.
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Evaluator description.
        details:
          anyOf:
          - {}
          - type: 'null'
          description: Evaluator-specific details.
        error:
          anyOf:
          - type: string
          - type: 'null'
          description: Evaluator error, when scoring failed.
        createdAt:
          anyOf:
          - type: string
          - type: string
      required:
      - id
      - runId
      - automationId
      - evaluatorName
      - evaluatorType
      - score
      - passed
      - label
      - weight
      - passThreshold
      - description
      - details
      - error
      - createdAt
      additionalProperties: false
      description: Automated evaluator result for one run.
    DatasetExampleExpectedFileUploadResponse:
      type: object
      properties:
        uploaded:
          type: array
          items:
            type: string
          description: Stored expected file paths.
      required:
      - uploaded
      additionalProperties: false
    EvaluatorConfigResponse:
      type: object
      properties:
        automationId:
          type: string
          description: Automation that owns this evaluator config.
        automationType:
          $ref: '#/components/schemas/AutomationType'
        yaml:
          type: string
          description: Evaluator configuration YAML.
        config:
          type: object
          properties:
            evaluators:
              type: array
              items: {}
              description: Parsed evaluator definitions from the YAML.
            passThreshold:
              type: number
              description: Overall score threshold required for the experiment to pass.
          required:
          - evaluators
          - passThreshold
          additionalProperties: false
      required:
      - automationId
      - automationType
      - yaml
      - config
      additionalProperties: false
      description: Evaluator YAML and parsed evaluator configuration for an automation.
    ApiErrorEnvelope:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ApiErrorIssue'
        requestId:
          type: string
          description: Request id echoed via the x-request-id header
        hint:
          description: Suggested fix for known error patterns
          type: string
        docsUrl:
          description: Link to relevant docs
          type: string
      required:
      - issues
      - requestId
      additionalProperties: false
    EvaluatorConfigUpdate:
      type: object
      properties:
        yaml:
          type: string
          minLength: 1
          maxLength: 1048576
          description: Complete evaluator YAML to validate and store.
      required:
      - yaml
      description: Replacement evaluator configuration.
    DatasetExampleExpectedFileList:
      type: object
      properties:
        files:
          type: array
          items:
            type: string
          description: Paths under the example expected folder.
      required:
      - files
      additionalProperties: false
    ExampleRunResponse:
      type: object
      properties:
        id:
          type: string
          description: Run id created for this example.
        type:
          type: string
          enum:
          - workflow
          - agent
          description: Implementation type behind the automation.
        batchId:
          anyOf:
          - type: string
          - type: 'null'
          description: Experiment batch id when the run is associated with a batch. The API also calls this an experiment id in experiment routes.
        finished:
          type: boolean
          const: false
          description: Example runs are accepted asynchronously.
      required:
      - id
      - type
      - batchId
      - finished
      additionalProperties: false
    ApiErrorIssue:
      type: object
      properties:
        field:
          type: string
          description: JSON path of the offending field, or "<root>"
        message:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code (e.g. invalid_value, not_found, api_trigger_disabled, manual_trigger_disabled)
        severity:
          type: string
          enum:
          - error
          - warning
          description: Issue severity
      required:
      - field
      - message
      - code
      - severity
      additionalProperties: false
    AutomationType:
      type: string
      enum:
      - workflow
      - agent
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API key issued from Settings → API Keys. Pass as `Authorization: Bearer <key>`.'
