  /v1/automations/{id}/dataset-review-requests/{reviewId}/items/{itemId}/files/{path}:
    get:
      operationId: automations.datasetReviewRequests.itemFile.get
      summary: Download dataset review item file
      description: Download one input file (default) or expected-output file (`?kind=expected`) belonging to a review item. Authorized by `dataset_review:read` and scoped to files referenced in the item snapshot, so reviewers without workflow read can still preview documents. Expected files resolve to reviewer-corrected bytes when the item has a file overlay.
      tags:
      - Evaluation
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: Automation id or typed alias.
        required: true
        description: Automation id or typed alias.
      - in: path
        name: reviewId
        schema:
          type: string
          description: Dataset review request id.
        required: true
        description: Dataset review request id.
      - in: path
        name: itemId
        schema:
          type: string
          description: Dataset review item id.
        required: true
        description: Dataset review item id.
      - in: path
        name: path
        schema:
          type: string
          description: Slash-delimited path under the example input folder (default) or expected folder (?kind=expected) referenced by the item snapshot.
        required: true
        description: Slash-delimited path under the example input folder (default) or expected folder (?kind=expected) referenced by the item snapshot.
      - in: query
        name: kind
        schema:
          description: Which file tree to serve. `expected` resolves to reviewer-corrected bytes when the item has a file overlay, else the snapshot bytes.
          type: string
          enum:
          - input
          - expected
        description: Which file tree to serve. `expected` resolves to reviewer-corrected bytes when the item has a file overlay, else the snapshot bytes.
      responses:
        '200':
          description: File bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                description: Review item file bytes (input or expected).
                format: binary
