components:
  schemas:
    DatasetReviewEventList:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/DatasetReviewEvent'
      required:
      - events
      additionalProperties: false
    ExperimentRef:
      type: object
      properties:
        id:
          type: string
        automationId:
          type: string
      required:
      - id
      - automationId
      additionalProperties: false
    DatasetReviewFocusField:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          description: Dotted expected-output path the reviewer should inspect, e.g. vendor.iban.
        reason:
          description: Optional reason this field needs attention.
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
      required:
      - path
    DatasetReviewCreateItemNote:
      type: object
      properties:
        exampleName:
          type: string
          minLength: 1
        comment:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/DatasetReviewItemFieldNote'
      required:
      - exampleName
    DatasetReviewItemFieldNote:
      type: object
      properties:
        path:
          type: string
          minLength: 1
        comment:
          type: string
          minLength: 1
      required:
      - path
      - comment
    RunScoresResponse:
      type: object
      properties:
        scores:
          type: array
          items:
            $ref: '#/components/schemas/EvalResult'
          description: Automated evaluator scores for the run. These are separate from human review verdicts.
      required:
      - scores
      additionalProperties: false
      description: Automated evaluator results attached to a run.
    DatasetExample:
      type: object
      properties:
        id:
          type: string
          description: Stable public example id. Workflow examples use DB ids; agent examples use deterministic name-derived ids.
        name:
          type: string
          description: Human-readable dataset example name.
        automationId:
          type: string
          description: Automation that owns this example.
        automationType:
          $ref: '#/components/schemas/AutomationType'
        input:
          anyOf:
          - type: object
            propertyNames:
              type: string
            additionalProperties: {}
          - type: 'null'
          description: Input arguments used when this example is run. Null when listing with `include=metadata`.
        expected:
          anyOf:
          - {}
          - type: 'null'
          description: Expected JSON output for evaluator comparisons. Null when listing with `include=metadata`.
        expectedFiles:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Expected file name.
              url:
                description: Download URL for the expected file.
                type: string
            required:
            - name
            additionalProperties: false
          description: Expected files attached to this example.
        metadata:
          anyOf:
          - type: object
            propertyNames:
              type: string
            additionalProperties: {}
          - type: 'null'
          description: Caller-managed metadata for sorting or filtering examples.
        annotation:
          anyOf:
          - type: string
          - type: 'null'
          description: Human note about the example.
        rowOrder:
          anyOf:
          - type: number
          - type: 'null'
          description: Optional display order within the dataset.
        overrides:
          anyOf:
          - type: object
            propertyNames:
              type: string
            additionalProperties: {}
          - type: 'null'
          description: Step output overrides used when running this example.
        latestRunId:
          anyOf:
          - type: string
          - type: 'null'
          description: Most recent run id created from this example.
        createdAt:
          anyOf:
          - type: string
          - type: string
        updatedAt:
          anyOf:
          - anyOf:
            - type: string
            - type: string
          - type: 'null'
      required:
      - id
      - name
      - automationId
      - automationType
      - input
      - expected
      - expectedFiles
      - metadata
      - annotation
      - rowOrder
      - overrides
      - latestRunId
      additionalProperties: false
      description: One input/expected-output row in an automation dataset.
    DatasetImportResponse:
      anyOf:
      - type: object
        properties:
          mode:
            type: string
            const: append
          created:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
          expectedSet:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
          skipped:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
          issues:
            type: array
            items: {}
        required:
        - mode
        - created
        - expectedSet
        - skipped
        - issues
        additionalProperties: false
      - type: object
        properties:
          mode:
            type: string
            const: replace
          created:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
          expectedSet:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
          deleted:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
          filesDeleted:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
        required:
        - mode
        - created
        - expectedSet
        - deleted
        - filesDeleted
        additionalProperties: false
    DatasetExampleInputFileRenameResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        filename:
          type: string
        path:
          type: string
          description: Updated input file path.
      required:
      - ok
      - filename
      - path
      additionalProperties: false
    DatasetExampleExpectedFileRenameRequest:
      type: object
      properties:
        newFilename:
          type: string
          description: New basename for the file. The parent folder is preserved.
      required:
      - newFilename
    DatasetReviewItemResponse:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/DatasetReviewItem'
      required:
      - item
      additionalProperties: false
    EvalResult:
      type: object
      properties:
        id:
          type: string
          description: Evaluator result id.
        runId:
          type: string
          description: Run this score belongs to.
        automationId:
          anyOf:
          - type: string
          - type: 'null'
          description: Automation this score belongs to.
        evaluatorName:
          type: string
          description: Evaluator name from configuration.
        evaluatorType:
          type: string
          description: Evaluator implementation type.
        score:
          anyOf:
          - type: number
          - type: 'null'
          description: Automated evaluator score. Do not confuse this with a human review verdict.
        passed:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Whether this evaluator passed.
        label:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional evaluator label.
        weight:
          anyOf:
          - type: number
          - type: 'null'
          description: Weight used in aggregate scoring.
        passThreshold:
          anyOf:
          - type: number
          - type: 'null'
          description: Score threshold required for this evaluator to pass.
        description:
