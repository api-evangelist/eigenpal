components:
  schemas:
    ApiErrorEnvelope:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ApiErrorIssue'
        requestId:
          type: string
          description: Request id echoed via the x-request-id header
        hint:
          description: Suggested fix for known error patterns
          type: string
        docsUrl:
          description: Link to relevant docs
          type: string
        conflictingWorkflowId:
          description: Present on 409 workflow_name_conflict responses. Id of the workflow that already owns the requested name.
          type: string
      required:
      - issues
      - requestId
      additionalProperties: false
    ApiErrorIssue:
      type: object
      properties:
        field:
          type: string
          description: JSON path of the offending field, or "<root>"
        message:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code (e.g. invalid_value, not_found, api_trigger_disabled, manual_trigger_disabled)
        severity:
          type: string
          enum:
          - error
          - warning
          description: Issue severity
      required:
      - field
      - message
      - code
      - severity
      additionalProperties: false
    ListFoldersResponse:
      type: array
      items:
        $ref: '#/components/schemas/Folder'
    UpdateFolderRequest:
      type: object
      properties:
        name:
          description: New folder name. Cannot contain `/`.
          type: string
          minLength: 1
          maxLength: 255
        parentId:
          description: New parent folder id. `null` moves the folder to the tree root.
          anyOf:
          - type: string
          - type: 'null'
    FolderType:
      type: string
      enum:
      - workflow
      - template
    Folder:
      type: object
      properties:
        id:
          type: string
        parentId:
          anyOf:
          - type: string
          - type: 'null'
        type:
          $ref: '#/components/schemas/FolderType'
        name:
          type: string
        createdAt:
          anyOf:
          - type: string
          - type: string
        childCount:
          description: Direct subfolder count. Present on tree listings.
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        workflowCount:
          description: Workflows filed directly in this folder. Present on workflow-tree listings.
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        previewItems:
          description: Up to a handful of item names — subfolders first, then workflows — for a peek at folder contents. Present on workflow-tree listings.
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              kind:
                type: string
                enum:
                - folder
                - workflow
            required:
            - name
            - kind
            additionalProperties: false
      required:
      - id
      - parentId
      - type
      - name
      - createdAt
      additionalProperties: false
    CreateFolderRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Folder name. Cannot contain `/`.
        type:
          description: Which folder tree to create in. Required; there is no default.
          $ref: '#/components/schemas/FolderType'
        parentId:
          description: Parent folder id. Omit or `null` to create at the tree root.
          anyOf:
          - type: string
          - type: 'null'
      required:
      - name
      - type
    DeleteFolderResponse:
      type: object
      properties:
        deleted:
          type: boolean
          const: true
        id:
          type: string
      required:
      - deleted
      - id
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API key issued from Settings → API Keys. Pass as `Authorization: Bearer <key>`.'
