  /v1/files/uploads:
    post:
      operationId: files.uploads.create
      summary: Prepare file upload
      description: Negotiate HTTP multipart for small bodies, a short-lived signed PUT under the single-object ceiling, storage-direct multipart (presigned-multipart) for larger files when storage supports MPU, or app-server http-chunked PUTs when direct uploads are disabled. The response transport is authoritative; clients must not guess from file size alone.
      tags:
      - Files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFileUploadSessionRequest'
      responses:
        '200':
          description: Negotiated upload transport
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PresignedFileUploadSession'
                - $ref: '#/components/schemas/PresignedMultipartFileUploadSession'
                - $ref: '#/components/schemas/HttpChunkedFileUploadSession'
                - $ref: '#/components/schemas/MultipartFileUploadFallback'
        '400':
          description: Validation error. Request shape did not match the spec.
          content:
