  /v1/files/uploads/{uploadId}/chunks/{chunkIndex}:
    put:
      operationId: files.uploads.chunks.put
      summary: Upload one file chunk
      description: Accept one raw body for an http-chunked session. Each chunk must match the negotiated size; chunks are accepted in order. Idempotent overwrite of the current index is allowed.
      tags:
      - Files
      parameters:
      - in: path
        name: uploadId
        schema:
          type: string
        required: true
      - in: path
        name: chunkIndex
        schema:
          type: string
        required: true
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              description: Raw chunk bytes
              format: binary
      responses:
        '200':
          description: Chunk accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptHttpChunkedUploadChunkResponse'
