overlay: 1.0.0
info:
  title: API Evangelist enhancements for Eigenpal API
  version: 1.0.0
extends: openapi/eigenpal-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-07-19'
    x-apievangelist-artifacts:
    - authentication
    - conventions
    - errors
    - lifecycle
    - changelog
    - conformance
    - asyncapi(webhooks)
    - packages/SDKs
    - cli
    - mcp(candidate)
    - data-model
    - skills
- target: $.info
  update:
    x-webhooks-doc: https://docs.eigenpal.com/guides/outbound-webhooks
- target: $.servers
  update:
  - x-apievangelist-note: Production host; SDKs/CLI accept a custom base URL for self-hosted deployments.
