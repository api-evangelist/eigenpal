- version: '0.10.20'
  date: '2026-07-12'
  breaking: false
  highlights:
  - Configurable automatic retries at the workflow level or per HTTP GET/HEAD and Website Reader step.
  - Durable, step-scoped retry of replay-safe network steps with bounded backoff.
