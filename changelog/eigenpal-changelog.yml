- version: '0.10.24'
  date: '2026-07-15'
  breaking: false
  highlights:
  - Agent runs graded by evaluators now record a weighted score and pass/fail result.
  - Workflow email addresses are unique org-wide with clearer conflict messages (409 instead of 500).
  - ai.extract grounded:true fails loudly on misconfiguration instead of silently producing no grounding.
  - Self-hosted deployments support corporate SSO via a redirect-and-token flow with mutual TLS and directory-group role mapping.
  - 'API: sync-after-release no longer 500s; single-experiment results export fixed; duplicate email trigger returns 409.'
- version: '0.10.23'
