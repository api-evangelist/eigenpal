aid: eigenpal
name: Eigenpal
description: >-
  EigenPal is an AI document-automation platform that replaces manual document
  reading and data entry for enterprises. Teams build directed graphs of typed
  steps (workflows) or Git-backed agents that parse, extract, classify,
  transform, and route data from messy scans, handwritten forms, invoices, KYC
  documents, claims, shipping forms, contracts, and receipts. Workflows are
  authored as plain files, evaluated against datasets with automated scoring
  before going live, and deployed on-prem or in the cloud. A public REST API,
  TypeScript and Python SDKs, and a CLI let developers start and monitor runs,
  manage files and datasets, collect human reviews, run evaluation experiments,
  and receive signed run-lifecycle webhooks.
